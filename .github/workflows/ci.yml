name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Install the tested Android SDK packages
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # sdkmanager remains the pipeline status; yes may receive SIGPIPE.
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --install 'platforms;android-29' 'build-tools;35.0.0'
      - name: Check offline renderer test prerequisites
        shell: bash
        run: |
          node --version
          npm --version
          google-chrome --version
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Test, lint, and build both variants
        run: ./gradlew --no-daemon --stacktrace hostTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease
      - name: Verify the debug APK
        run: >-
          python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk
          --variant debug --signature signed
          --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
          --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Verify the unsigned release APK
        run: >-
          python3 scripts/verify-apk.py app/build/outputs/apk/release/app-release-unsigned.apk
          --variant release --signature unsigned
          --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
          --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Preserve lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 7
