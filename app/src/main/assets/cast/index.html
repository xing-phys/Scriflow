<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Scriflow · Screen cast</title>
  <link rel="stylesheet" href="/viewer.css"><script src="/viewer.js" defer></script>
</head>
<body>
  <header><strong>Scriflow</strong><span>Screen cast</span><button id="fullscreen" hidden>Full screen</button><button id="logout" hidden>Disconnect</button></header>
  <main>
    <form id="login">
      <h1>Your tablet, here.</h1><p>Enter the password set in Scriflow on the tablet.</p>
      <label for="password">Cast password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
      <button id="connect" type="submit">Connect</button>
      <p class="note">Keep both devices on the same trusted Wi-Fi. This local connection uses HTTP.</p>
    </form>
    <section id="viewer" aria-label="Tablet screen" hidden><img id="screen" alt="Live Scriflow screen" hidden></section>
    <p id="status" role="status" aria-live="polite">Local, view-only sharing.</p>
  </main>
</body>
</html>
